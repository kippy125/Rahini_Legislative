<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Centered Form Page</title>
	<style>
		/* Basic reset and flex layout for sticky footer */
		body {
			margin: 0;
			display: flex;
			flex-direction: column;
			min-height: 100vh;
			font-family: Arial, sans-serif;
		}

		/* Black Header and Footer */
		header,
		footer {
			background-color: black;
			color: white;
			padding: 1rem;
			text-align: center;
		}

		/* Main Body Area: Centered Content */
		main {
			flex: 1;
			/* Pushes footer to the bottom */
			display: flex;
			justify-content: center;
			/* Horizontal center */
			align-items: center;
			/* Vertical center */
			background-color: #f4f4f4;
		}

		/* Form Styling */
		.form-container {
			background: white;
			padding: 2rem;
			border-radius: 8px;
			box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			width: 100%;
			max-width: 400px;
		}

		.form-group {
			margin-bottom: 1rem;
		}

		.form-group label {
			display: block;
			margin-bottom: .5rem;
		}

		.form-group select,
		.form-group input {
			width: 100%;
			padding: .5rem;
		}

		button {
			width: 100%;
			padding: .7rem;
			background: #333;
			color: white;
			border: none;
			cursor: pointer;
		}
	</style>
</head>

<body>

	<header>
		<h1 th:text="'Welcome to OHIO Legislative Information System'"></h1>
	</header>

	<main>

		<form th:action="@{/saveLegislation}" th:object="${legislation}" method="post">
			<h1 th:text="'Add New Legislation'">Add New Legislation</h1><br><br>
			<input type="text" th:field="*{title}" placeholder="Title" required />
			<input type="text" th:field="*{text_desc}" placeholder="Text" required />
			<label>Choose Options:</label>
			<select th:field="*{sponsors}" multiple="multiple" class="form-control" size="1" onfocus="this.size=5;"
				onblur="this.size=1;" onchange="this.size=1; this.blur();">
				<option th:each="name : ${names}" th:value="${name}" th:text="${name}">Option Name</option>
			</select>
			<br><br><br><br>
			<button type="submit">Submit</button>
		</form>
	</main>

	<footer>
		<p>&copy; 2026 OHIO LEGISLATIVE INFO. All rights reserved.</p>
	</footer>

</body>

</html>
